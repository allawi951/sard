<!doctype html><html dir="rtl" lang="ar"><meta charset="utf-8">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&display=swap');
  :root { --ink:#14132F; --cream:#F8F0E9; --gold:#C9A15A; }
  body { margin:0; background:var(--ink); color:var(--cream);
         font:15px/1.7 'Amiri',Georgia,serif; padding:34px; }
  h1 { font-size:30px; font-weight:400; margin:0 0 6px; letter-spacing:.02em; }
  .sub { color:rgba(248,240,233,.55); margin:0 0 30px; font-size:14px; }
  .grid { display:grid; grid-template-columns:repeat(3,1fr); gap:26px; }
  figure { margin:0; }
  .frame { background:rgba(248,240,233,.04); border:1px solid rgba(248,240,233,.13);
           border-radius:4px; padding:26px; display:grid; place-items:center; }
  .mark { width:150px; height:150px; color:var(--gold); }
  figcaption b { display:block; font-size:18px; margin-top:14px; }
  .id { font:11px ui-monospace,monospace; color:rgba(248,240,233,.4); letter-spacing:.06em; }
  figcaption p { color:rgba(248,240,233,.62); font-size:13.5px; margin:7px 0 0; }
  .row { margin-top:38px; padding-top:24px; border-top:1px solid rgba(248,240,233,.13); }
  .row h2 { font-size:17px; font-weight:400; color:var(--gold); margin:0 0 16px; }
  .small { display:flex; gap:30px; align-items:flex-end; }
  .small div { text-align:center; color:rgba(248,240,233,.5); font-size:11px; }
  .small svg { color:var(--cream); display:block; margin-bottom:6px; }
</style>
<h1>شعار «سرد» — ست صيغ</h1>
<p class="sub">كلّها خطّية بالكامل ليُطبَّق عليها الرسم بحركة stroke-dashoffset، وكلّها من مفردات زخرفة الثيم.</p>
<div class="grid">
  <figure>
    <div class="frame"><svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg" class="mark">
  <g fill="none" stroke="currentColor" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round">
    <path d="M22 34 A 32 32 0 1 0 78 34"/>
    <path d="M34 56 V 46"/>
    <path d="M45 56 V 41"/>
    <path d="M56 56 V 46"/>
    <path d="M30 56 H 60 A 10 10 0 0 1 70 66"/>
  </g>
</svg></div>
    <figcaption>
      <b>1. س داخل الفراغ</b>
      <span class="id">seen-void</span>
      <p>حرف «س» مُجرَّدًا إلى أسنانه الثلاثة وذيله، داخل قوس مفتوح لا دائرة مغلقة. بؤرة واحدة، وفراغ سالب يتجاوز النصف. الأسنان تتدرّج في الارتفاع فتكسر التناظر وتمنح توتّرًا بصريًّا.</p>
    </figcaption>
  </figure>
  <figure>
    <div class="frame"><svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg" class="mark">
  <g fill="none" stroke="currentColor" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M50 12 L 88 50 L 50 88 L 12 50 Z"/>
    <path d="M34 52 V 44"/>
    <path d="M44 52 V 38"/>
    <path d="M54 52 V 44"/>
    <path d="M30 52 H 58 A 8 8 0 0 1 66 60"/>
  </g>
</svg></div>
    <figcaption>
      <b>2. س في المعيّن</b>
      <span class="id">seen-diamond</span>
      <p>المعيّن المركزي — أوضح علامات الزخرفة — يحتضن الحرف. عنصران اثنان لا أكثر، والمعيّن يمنح الثبات البنيوي بينما الحرف يبقى البؤرة.</p>
    </figcaption>
  </figure>
  <figure>
    <div class="frame"><svg viewBox="126.0 78.0 129.0 78.0" xmlns="http://www.w3.org/2000/svg" class="mark">
    <g fill="none" stroke="currentColor" stroke-width="1.5"
       stroke-linecap="round" stroke-linejoin="round" vector-effect="non-scaling-stroke">
      <path d="M249 94L251 96L251 108L246 116L239 115L233 111L230 116L225 120L217 119L215 116L208 116L201 118L198 120L197 130L192 140L183 150L179 152L171 152L159 146L159 145L163 147L174 147L186 140L191 135L195 128L195 124L192 119L195 111L212 106L217 106L218 109L222 112L228 111L233 107L238 96L238 104L247 108L248 106L246 102L249 95Z"/>
      <path d="M142 82L148 84L155 91L159 99L158 115L150 119L137 121L132 120L130 118L131 110L135 112L140 112L151 110L157 107L154 99L149 94L139 89L141 83Z"/>
    </g>
</svg></div>
    <figcaption>
      <b>3. سرد — كلمة (خطّ أميري)</b>
      <span class="id">sard-word</span>
      <p>الكلمة كاملةً بخطّ أميري — خطّ الثيم نفسه — مُتتبَّعة إلى حدودٍ خطّية بالأداة التي بنيناها للثيم. الحروف صحيحة لأن مصدرها الخطّ لا يدي، ويُرسم كفافها خطًّا خطًّا كأن قلمًا يكتبها.</p>
    </figcaption>
  </figure>
  <figure>
    <div class="frame"><svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg" class="mark">
  <g fill="none" stroke="currentColor" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M14 44 C 34 20 66 20 86 44"/>
    <path d="M22 48 C 38 30 62 30 78 48"/>
    <path d="M36 74 V 64"/>
    <path d="M46 74 V 59"/>
    <path d="M56 74 V 64"/>
    <path d="M32 74 H 60 A 8 8 0 0 1 68 82"/>
  </g>
</svg></div>
    <figcaption>
      <b>4. القوس والحرف</b>
      <span class="id">arc-seen</span>
      <p>القوس المزدوج منقولًا حرفيًّا من الزخرفة، والحرف تحته. أقرب الصيغ نسبًا للثيم — من رآه في الواجهة عرفه في متجر الثيمات.</p>
    </figcaption>
  </figure>
  <figure>
    <div class="frame"><svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg" class="mark">
  <g fill="none" stroke="currentColor" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round">
    <path d="M34 52 V 40"/>
    <path d="M46 52 V 34"/>
    <path d="M58 52 V 40"/>
    <path d="M28 52 H 64 A 10 10 0 0 1 74 62"/>
    <path d="M14 74 C 30 68 46 80 62 74 C 74 69 82 72 88 76"/>
  </g>
</svg></div>
    <figcaption>
      <b>5. س والموجة</b>
      <span class="id">seen-wave</span>
      <p>الحرف يقف على موجة الزخرفة بدل سطر مستقيم — السرد جريان لا سكون. عنصران، وعدم تناظر مقصود في ميل الموجة.</p>
    </figcaption>
  </figure>
  <figure>
    <div class="frame"><svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg" class="mark">
  <g fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round">
    <path d="M20 30 H 80"/>
    <path d="M20 38 H 72"/>
    <path d="M20 46 H 58"/>
    <path d="M20 54 H 46"/>
    <path d="M20 62 H 58"/>
    <path d="M20 70 H 72"/>
    <path d="M20 78 H 80"/>
    <path d="M86 26 V 82"/>
  </g>
</svg></div>
    <figcaption>
      <b>6. س من نظام خطوط</b>
      <span class="id">seen-lines</span>
      <p>كتلة من ثمانية خطوط أفقية متدرّجة الطول ترسم كتفَ الحرف بالسالب لا بالموجب. تكرار كثيف يمنح الثقل البنيوي الذي توصي به المهارة للأنظمة الخطّية، والحرف يظهر بالتعرّف لا بالرسم الصريح.</p>
    </figcaption>
  </figure></div>
